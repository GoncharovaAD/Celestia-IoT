site_name: Celestia-IoT
site_description: Open-source space and environmental monitoring station
site_author: Anna Goncharova

theme: 
  name: material
  favicon: img/favicon.ico

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Data Sources: data-sources.md
  - API: api.md
  - Troubleshooting: troubleshooting.md

plugins:
  - search